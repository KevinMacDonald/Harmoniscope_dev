# ALSA configuration for a shared USB audio device.
# This configuration creates a software mixer (dmix) that allows multiple
# applications to play audio through the USB sound card simultaneously
# without causing "device or resource busy" errors.
 
pcm.dmixer {
    type dmix
    ipc_key 1024
    ipc_perm 0666  # Allow all users to use the mixer
    slave {
        pcm "hw:Device,0"
        period_time 0
        period_size 1024
        buffer_size 4096
        rate 44100
    }
    bindings {
        0 0
        1 1
    }
}
ctl.dmixer {
    type hw
    card Device
}
pcm.!default {
    type plug
    slave.pcm "dmixer"
}
ctl.!default {
    type hw
    card Device
}