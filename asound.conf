# ALSA configuration to set the default sound card.
#
# This configuration creates a software mixing device (dmix) to allow
# multiple applications to play audio through the USB sound card simultaneously.
# This prevents "device or resource busy" errors and is a more robust setup.

pcm.dmixer {
    type dmix
    ipc_key 1024 # An arbitrary but unique number
    slave {
        pcm "hw:Device,0" # Use the card named "Device"
        period_time 0
        period_size 1024
        buffer_size 4096
        rate 44100
        channels 2
    }
}

pcm.!default {
    type plug
    slave.pcm "dmixer"
}
ctl.!default {
    type hw
    card Device
}